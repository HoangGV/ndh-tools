<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDH Tools — Bộ công cụ đa tiện ích trực tuyến</title>
    <meta
      name="description"
      content="Bộ công cụ đa tiện ích trực tuyến xử lý 100% trên trình duyệt: nén & chuyển đổi định dạng ảnh hàng loạt, tạo mã QR tùy chỉnh, và tạo sơ đồ thư mục hỗ trợ tiếng Việt chuẩn."
    />
    <meta property="og:title" content="NDH Tools — Bộ công cụ đa tiện ích trực tuyến" />
    <meta
      property="og:description"
      content="Nén & đổi định dạng ảnh hàng loạt, tạo mã QR tùy chỉnh và tạo sơ đồ cấu trúc thư mục hỗ trợ tiếng Việt chuẩn, chạy hoàn toàn trên trình duyệt."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ndh-tools-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-[#4169E1]/20 selection:text-[#4169E1]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
